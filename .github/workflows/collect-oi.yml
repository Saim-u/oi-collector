name: Collect Open Interest

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-oi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas pyarrow

      - name: Fetch OI
        run: python collector/fetch_oi.py

      - name: Commit data
        run: |
          git config user.name  "oi-collector"
          git config user.email "actions@github.com"
          git add data/oi/
          git diff --staged --quiet || git commit -m "OI $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
